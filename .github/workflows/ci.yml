name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lint and syntax-check all shell scripts (via mise)
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install mise
        run: curl -fsSL https://mise.run | sh
      - name: Validate mise.toml
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mise tasks
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mise run lint

  # Smoke test: build base-tools image
  build-base:
    name: Build base-tools (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build base-tools
        run: scripts/ci-setup.sh
      - name: Verify
        run: podman images localhost/agent-sandbox:base-tools

  # Smart matrix: all harnesses × base stack
  test-harness:
    name: Harness — ${{ matrix.harness }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, opencode, vibe, pi]
    steps:
      - uses: actions/checkout@v6
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build base-tools + ${{ matrix.harness }}
        run: scripts/ci-setup.sh "${{ matrix.harness }}"
      - name: Verify
        run: podman images "localhost/agent-sandbox:base-tools-${{ matrix.harness }}"

  # Smart matrix: all top-level stacks × [claude, opencode]
  test-stack:
    name: Stack — ${{ matrix.stack }} / ${{ matrix.harness }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [python, node, rust, elixir, lua-nvim, clojure]
        harness: [claude, opencode]
    steps:
      - uses: actions/checkout@v6
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build base + harness
        run: scripts/ci-setup.sh "${{ matrix.harness }}"
      - name: Build ${{ matrix.stack }}-${{ matrix.harness }}
        run: |
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE="localhost/agent-sandbox:base-tools-${{ matrix.harness }}" \
            -t "localhost/agent-sandbox:${{ matrix.stack }}-${{ matrix.harness }}" \
            "stacks/${{ matrix.stack }}/"
      - name: Verify
        run: podman images "localhost/agent-sandbox:${{ matrix.stack }}-${{ matrix.harness }}"

  # Manual mode: stack builds directly on base-tools (no harness layer)
  test-manual:
    name: Manual — ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [python, node]
    steps:
      - uses: actions/checkout@v6
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build base-tools
        run: scripts/ci-setup.sh
      - name: Build ${{ matrix.stack }}-manual
        run: |
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE=localhost/agent-sandbox:base-tools \
            -t "localhost/agent-sandbox:${{ matrix.stack }}-manual" \
            "stacks/${{ matrix.stack }}/"
      - name: Verify
        run: podman images "localhost/agent-sandbox:${{ matrix.stack }}-manual"

  # Smart matrix: chains × [claude, opencode]
  test-chain-web:
    name: Chain web-cljs — ${{ matrix.harness }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, opencode]
    steps:
      - uses: actions/checkout@v6
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build chain
        run: |
          scripts/ci-setup.sh "${{ matrix.harness }}"
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE="localhost/agent-sandbox:base-tools-${{ matrix.harness }}" \
            -t "localhost/agent-sandbox:clojure-${{ matrix.harness }}" stacks/clojure/
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE="localhost/agent-sandbox:clojure-${{ matrix.harness }}" \
            -t "localhost/agent-sandbox:web-cljs-${{ matrix.harness }}" stacks/web-cljs/
      - name: Verify
        run: podman images "localhost/agent-sandbox:web-cljs-${{ matrix.harness }}"

  test-chain-rn:
    name: Chain react-native — ${{ matrix.harness }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, opencode]
    steps:
      - uses: actions/checkout@v6
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build chain
        run: |
          scripts/ci-setup.sh "${{ matrix.harness }}"
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE="localhost/agent-sandbox:base-tools-${{ matrix.harness }}" \
            -t "localhost/agent-sandbox:clojure-${{ matrix.harness }}" stacks/clojure/
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE="localhost/agent-sandbox:clojure-${{ matrix.harness }}" \
            -t "localhost/agent-sandbox:web-cljs-${{ matrix.harness }}" stacks/web-cljs/
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE="localhost/agent-sandbox:web-cljs-${{ matrix.harness }}" \
            -t "localhost/agent-sandbox:react-native-cljs-${{ matrix.harness }}" stacks/react-native-cljs/
      - name: Verify
        run: podman images "localhost/agent-sandbox:react-native-cljs-${{ matrix.harness }}"
