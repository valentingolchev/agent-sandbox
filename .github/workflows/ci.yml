name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lint and syntax-check all shell scripts
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | \
            xargs -0 shellcheck --severity=warning

      - name: Bash syntax check
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | \
            xargs -0 -I {} bash -n {}
          bash -n .local/bin/agent-sandbox
          bash -n install.sh
          bash -n run.sh
          bash -n test.sh

      - name: Validate mise.toml
        run: |
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise tasks

  # Smoke test: build base-tools image
  build-base:
    name: Build base-tools (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build base-tools
        run: |
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            -t localhost/agent-sandbox:base-tools base/
      - name: Verify
        run: podman images localhost/agent-sandbox:base-tools

  # Parallel: test each harness composition independently
  test-harness:
    name: Harness — ${{ matrix.harness }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, opencode, vibe, pi]
    steps:
      - uses: actions/checkout@v6
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build base-tools
        run: |
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            -t localhost/agent-sandbox:base-tools base/
      - name: Build base-tools + ${{ matrix.harness }}
        run: |
          tmpfile=$(mktemp)
          {
            echo "FROM localhost/agent-sandbox:base-tools"
            echo "USER root"
            cat "base/harness/${{ matrix.harness }}.sh"
            echo "RUN chown -R agent:agent /home/agent"
            echo "USER agent"
          } > "$tmpfile"
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            -t "localhost/agent-sandbox:base-tools-${{ matrix.harness }}" \
            -f "$tmpfile" base/
          rm -f "$tmpfile"
      - name: Verify
        run: podman images "localhost/agent-sandbox:base-tools-${{ matrix.harness }}"

  # Parallel: test each top-level stack with claude harness
  test-stack:
    name: Stack — ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [python, node, rust, elixir, lua-nvim, clojure]
    steps:
      - uses: actions/checkout@v6
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build base-tools + claude
        run: |
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            -t localhost/agent-sandbox:base-tools base/
          tmpfile=$(mktemp)
          {
            echo "FROM localhost/agent-sandbox:base-tools"
            echo "USER root"
            cat base/harness/claude.sh
            echo "RUN chown -R agent:agent /home/agent"
            echo "USER agent"
          } > "$tmpfile"
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            -t localhost/agent-sandbox:base-tools-claude \
            -f "$tmpfile" base/
          rm -f "$tmpfile"
      - name: Build ${{ matrix.stack }}-claude
        run: |
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE=localhost/agent-sandbox:base-tools-claude \
            -t "localhost/agent-sandbox:${{ matrix.stack }}-claude" \
            "stacks/${{ matrix.stack }}/"
      - name: Verify
        run: podman images "localhost/agent-sandbox:${{ matrix.stack }}-claude"

  # Manual mode: stack builds directly on base-tools (no harness layer)
  test-manual:
    name: Manual mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build base-tools
        run: |
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            -t localhost/agent-sandbox:base-tools base/
      - name: Build python-manual
        run: |
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE=localhost/agent-sandbox:base-tools \
            -t localhost/agent-sandbox:python-manual stacks/python/
      - name: Verify
        run: podman images localhost/agent-sandbox:python-manual

  # Chain: web-cljs → clojure → base-tools-claude
  test-chain-web:
    name: Chain — web-cljs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build chain
        run: |
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            -t localhost/agent-sandbox:base-tools base/
          tmpfile=$(mktemp)
          {
            echo "FROM localhost/agent-sandbox:base-tools"
            echo "USER root"
            cat base/harness/claude.sh
            echo "RUN chown -R agent:agent /home/agent"
            echo "USER agent"
          } > "$tmpfile"
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            -t localhost/agent-sandbox:base-tools-claude \
            -f "$tmpfile" base/
          rm -f "$tmpfile"
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE=localhost/agent-sandbox:base-tools-claude \
            -t localhost/agent-sandbox:clojure-claude stacks/clojure/
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE=localhost/agent-sandbox:clojure-claude \
            -t localhost/agent-sandbox:web-cljs-claude stacks/web-cljs/
      - name: Verify
        run: |
          podman images localhost/agent-sandbox:clojure-claude
          podman images localhost/agent-sandbox:web-cljs-claude

  # Chain: react-native-cljs → web-cljs → clojure → base-tools-claude
  test-chain-rn:
    name: Chain — react-native-cljs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build chain
        run: |
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            -t localhost/agent-sandbox:base-tools base/
          tmpfile=$(mktemp)
          {
            echo "FROM localhost/agent-sandbox:base-tools"
            echo "USER root"
            cat base/harness/claude.sh
            echo "RUN chown -R agent:agent /home/agent"
            echo "USER agent"
          } > "$tmpfile"
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            -t localhost/agent-sandbox:base-tools-claude \
            -f "$tmpfile" base/
          rm -f "$tmpfile"
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE=localhost/agent-sandbox:base-tools-claude \
            -t localhost/agent-sandbox:clojure-claude stacks/clojure/
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE=localhost/agent-sandbox:clojure-claude \
            -t localhost/agent-sandbox:web-cljs-claude stacks/web-cljs/
          podman build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE=localhost/agent-sandbox:web-cljs-claude \
            -t localhost/agent-sandbox:react-native-cljs-claude stacks/react-native-cljs/
      - name: Verify
        run: podman images localhost/agent-sandbox:react-native-cljs-claude
