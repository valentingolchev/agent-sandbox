name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMG: localhost/agent-sandbox

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install mise
        run: curl -fsSL https://mise.run | sh
      - name: Lint (mise installs shellcheck automatically)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mise run lint

  build-base:
    name: base-tools (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [podman, docker]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-runtime
        with:
          runtime: ${{ matrix.runtime }}
      - uses: ./.github/actions/build-base
        with:
          runtime: ${{ matrix.runtime }}
      - run: $CONTAINER_RUNTIME images $IMG:base-tools
        env:
          CONTAINER_RUNTIME: ${{ matrix.runtime }}

  test-harness:
    name: harness ${{ matrix.harness }} (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, opencode, vibe, pi]
        runtime: [podman, docker]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-runtime
        with:
          runtime: ${{ matrix.runtime }}
      - uses: ./.github/actions/build-base
        with:
          runtime: ${{ matrix.runtime }}
          harness: ${{ matrix.harness }}
      - run: $CONTAINER_RUNTIME images $IMG:base-tools-${{ matrix.harness }}
        env:
          CONTAINER_RUNTIME: ${{ matrix.runtime }}

  test-stack:
    name: ${{ matrix.stack }}/${{ matrix.harness }} (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [python, node, rust, elixir, lua-nvim, clojure]
        harness: [claude, opencode]
        runtime: [podman, docker]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-runtime
        with:
          runtime: ${{ matrix.runtime }}
      - uses: ./.github/actions/build-base
        with:
          runtime: ${{ matrix.runtime }}
          harness: ${{ matrix.harness }}
      - name: Build stack
        run: |
          $CONTAINER_RUNTIME build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE="$IMG:base-tools-${{ matrix.harness }}" \
            -t "$IMG:${{ matrix.stack }}-${{ matrix.harness }}" \
            "stacks/${{ matrix.stack }}/"
        env:
          CONTAINER_RUNTIME: ${{ matrix.runtime }}
      - run: $CONTAINER_RUNTIME images $IMG:${{ matrix.stack }}-${{ matrix.harness }}
        env:
          CONTAINER_RUNTIME: ${{ matrix.runtime }}

  test-manual:
    name: manual/${{ matrix.stack }} (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [python, node]
        runtime: [podman, docker]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-runtime
        with:
          runtime: ${{ matrix.runtime }}
      - uses: ./.github/actions/build-base
        with:
          runtime: ${{ matrix.runtime }}
      - name: Build stack (manual)
        run: |
          $CONTAINER_RUNTIME build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE="$IMG:base-tools" \
            -t "$IMG:${{ matrix.stack }}-manual" \
            "stacks/${{ matrix.stack }}/"
        env:
          CONTAINER_RUNTIME: ${{ matrix.runtime }}
      - run: $CONTAINER_RUNTIME images $IMG:${{ matrix.stack }}-manual
        env:
          CONTAINER_RUNTIME: ${{ matrix.runtime }}

  test-chain-web:
    name: chain web-cljs/${{ matrix.harness }} (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, opencode]
        runtime: [podman, docker]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-runtime
        with:
          runtime: ${{ matrix.runtime }}
      - uses: ./.github/actions/build-base
        with:
          runtime: ${{ matrix.runtime }}
          harness: ${{ matrix.harness }}
      - name: Build chain
        run: |
          $CONTAINER_RUNTIME build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE="$IMG:base-tools-${{ matrix.harness }}" \
            -t "$IMG:clojure-${{ matrix.harness }}" stacks/clojure/
          $CONTAINER_RUNTIME build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE="$IMG:clojure-${{ matrix.harness }}" \
            -t "$IMG:web-cljs-${{ matrix.harness }}" stacks/web-cljs/
        env:
          CONTAINER_RUNTIME: ${{ matrix.runtime }}
      - run: $CONTAINER_RUNTIME images $IMG:web-cljs-${{ matrix.harness }}
        env:
          CONTAINER_RUNTIME: ${{ matrix.runtime }}

  test-chain-rn:
    name: chain react-native/${{ matrix.harness }} (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, opencode]
        runtime: [podman, docker]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-runtime
        with:
          runtime: ${{ matrix.runtime }}
      - uses: ./.github/actions/build-base
        with:
          runtime: ${{ matrix.runtime }}
          harness: ${{ matrix.harness }}
      - name: Build chain
        run: |
          $CONTAINER_RUNTIME build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE="$IMG:base-tools-${{ matrix.harness }}" \
            -t "$IMG:clojure-${{ matrix.harness }}" stacks/clojure/
          $CONTAINER_RUNTIME build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE="$IMG:clojure-${{ matrix.harness }}" \
            -t "$IMG:web-cljs-${{ matrix.harness }}" stacks/web-cljs/
          $CONTAINER_RUNTIME build --build-arg UID=1000 --build-arg GID=1000 \
            --build-arg BASE_IMAGE="$IMG:web-cljs-${{ matrix.harness }}" \
            -t "$IMG:react-native-cljs-${{ matrix.harness }}" stacks/react-native-cljs/
        env:
          CONTAINER_RUNTIME: ${{ matrix.runtime }}
      - run: $CONTAINER_RUNTIME images $IMG:react-native-cljs-${{ matrix.harness }}
        env:
          CONTAINER_RUNTIME: ${{ matrix.runtime }}
