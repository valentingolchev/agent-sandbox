# mise config for agent-sandbox
# Tools: mise install   |   Tasks: mise tasks   |   Run: mise run <task>

[tools]
# Dev tools (installed by mise, managed automatically)
# Versions pinned — update deliberately
shellcheck = "0.11.0"
fzf = "0.67.0"

# System requirements (NOT installed by mise — use package manager):
#   stow:    sudo dnf install stow   (Fedora/RHEL)
#            sudo apt install stow   (Debian/Ubuntu)
#            brew install stow       (macOS)
#   podman:  sudo dnf install podman (Fedora/RHEL)
#            sudo apt install podman (Debian/Ubuntu)
#            brew install podman     (macOS)
#   docker:  Docker Desktop (macOS) or system package (Linux)
#   bash, git, curl — usually pre-installed

[tasks.setup]
description = "Set up agent-sandbox (stow + config + checks)"
run = "./lib/host/install.sh"

[tasks.check]
description = "Validate agent-sandbox config (agent-sandbox --check)"
run = "./.local/bin/agent-sandbox --check"

[tasks.lint]
description = "Shellcheck + bash syntax check (auto-installs shellcheck)"
run = "mise install && ./scripts/lint.sh"

[tasks."test-build"]
description = "Build and test image composition"
run = "./scripts/test-build.sh"

[tasks.test]
description = "Run all checks (config + lint + build tests)"
depends = ["check", "lint", "test-build"]

[tasks.start]
description = "Run agent-sandbox from source (no install needed)"
run = "./scripts/run.sh"

[tasks.build]
description = "Build base-tools image (uses $CONTAINER_RUNTIME, default: podman)"
run = "${CONTAINER_RUNTIME:-podman} build --build-arg UID=$(id -u) --build-arg GID=$(id -g) -t localhost/agent-sandbox:base-tools base/"

[tasks.clean]
description = "Remove all agent-sandbox images"
run = "R=${CONTAINER_RUNTIME:-podman}; $R rmi -f $($R images -q localhost/agent-sandbox) 2>/dev/null || true"
